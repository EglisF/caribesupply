<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tu carrito de compras - CaribeSupply">
    <title>Carrito | CaribeSupply S.A.S.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .cart-page { padding: var(--space-2xl) 0 var(--space-4xl); }
        .cart-layout { display: grid; grid-template-columns: 1fr 380px; gap: var(--space-2xl); }
        @media (max-width: 900px) { .cart-layout { grid-template-columns: 1fr; } }
        .cart-items { background: var(--bg-primary); border-radius: var(--radius-xl); padding: var(--space-xl); box-shadow: var(--shadow-sm); }
        .cart-item { display: grid; grid-template-columns: 100px 1fr auto; gap: var(--space-lg); padding: var(--space-lg) 0; border-bottom: 1px solid var(--bg-tertiary); align-items: center; }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-image { width: 100px; height: 100px; border-radius: var(--radius-lg); overflow: hidden; }
        .cart-item-image img { width: 100%; height: 100%; object-fit: cover; }
        .cart-item-info h3 { font-size: var(--text-lg); margin-bottom: var(--space-xs); }
        .cart-item-info .category { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-sm); }
        .cart-item-info .price { font-weight: 600; color: var(--color-primary); }
        .cart-item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-md); }
        .quantity-control { display: flex; align-items: center; gap: var(--space-sm); background: var(--bg-secondary); border-radius: var(--radius-md); padding: var(--space-xs); }
        .quantity-btn { width: 32px; height: 32px; border: none; background: var(--bg-primary); border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-lg); transition: all var(--transition-fast); }
        .quantity-btn:hover { background: var(--color-primary); color: white; }
        .quantity-value { width: 40px; text-align: center; font-weight: 600; }
        .remove-btn { background: none; border: none; color: var(--color-error); cursor: pointer; font-size: var(--text-sm); padding: var(--space-xs) var(--space-sm); }
        .remove-btn:hover { text-decoration: underline; }
        .cart-summary { background: var(--bg-primary); border-radius: var(--radius-xl); padding: var(--space-xl); box-shadow: var(--shadow-sm); height: fit-content; position: sticky; top: 100px; }
        .summary-title { font-size: var(--text-xl); margin-bottom: var(--space-xl); padding-bottom: var(--space-md); border-bottom: 2px solid var(--bg-tertiary); }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: var(--space-md); font-size: var(--text-sm); color: var(--text-secondary); }
        .summary-row.total { font-size: var(--text-xl); font-weight: 700; color: var(--text-primary); margin-top: var(--space-lg); padding-top: var(--space-lg); border-top: 2px solid var(--bg-tertiary); }
        .free-shipping-badge { background: rgba(45, 138, 94, 0.1); color: var(--color-success); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); font-size: var(--text-sm); text-align: center; margin-bottom: var(--space-lg); }
        .checkout-btn { width: 100%; margin-top: var(--space-lg); }
        .continue-shopping { display: block; text-align: center; margin-top: var(--space-md); font-size: var(--text-sm); }
        .empty-cart { text-align: center; padding: var(--space-4xl) var(--space-xl); }
        .empty-cart-icon { font-size: 5rem; margin-bottom: var(--space-lg); opacity: 0.5; }
        .empty-cart h2 { margin-bottom: var(--space-md); }
        .empty-cart p { color: var(--text-secondary); margin-bottom: var(--space-xl); }
        @media (max-width: 600px) {
            .cart-item { grid-template-columns: 80px 1fr; }
            .cart-item-actions { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    
    <header class="header">
        <nav class="nav">
            <a href="../index.html" class="logo"><span class="logo-icon">🌴</span><span class="logo-text">CaribeSupply</span></a>
            <button class="nav-toggle" aria-expanded="false"><span class="hamburger"></span></button>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="../index.html" class="nav-link">Inicio</a></li>
                <li><a href="catalogo.html" class="nav-link">Catálogo</a></li>
                <li><a href="clima.html" class="nav-link">Clima</a></li>
                <li><a href="tasas.html" class="nav-link">Tasas de Cambio</a></li>
                <li><a href="seguimiento.html" class="nav-link">Seguimiento</a></li>
                <li><a href="soporte.html" class="nav-link">Soporte</a></li>
            </ul>
            <div class="nav-actions">
                <a href="carrito.html" class="cart-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="m1 1 4 4h16l-2 10H7L5 5"/></svg><span class="cart-count" id="cart-count">0</span></a>
                <a href="login.html" class="login-btn" id="auth-btn">Iniciar Sesión</a>
            </div>
        </nav>
    </header>

    <main id="main-content">
        <section class="page-header">
            <div class="container">
                <nav class="breadcrumb"><a href="../index.html">Inicio</a><span>/</span><span>Carrito</span></nav>
                <h1 class="page-title">Tu Carrito</h1>
            </div>
        </section>

        <section class="cart-page">
            <div class="container">
                <div id="cart-content"></div>
            </div>
        </section>
    </main>

    <footer class="footer"><div class="container"><div class="footer-bottom"><p class="copyright">© 2024 CaribeSupply S.A.S.</p></div></div></footer>
    <div class="toast-container" id="toast-container"></div>

    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/main.js"></script>
    <script>
        function renderCartPage() {
            const container = document.getElementById('cart-content');
            const cartItems = Cart.getCartWithProducts();

            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <h2>Tu carrito está vacío</h2>
                        <p>Explora nuestros productos y encuentra artesanías únicas</p>
                        <a href="catalogo.html" class="btn btn-primary">Ver Catálogo</a>
                    </div>
                `;
                return;
            }

            const subtotal = Cart.getSubtotal();
            const tax = Cart.getTax();
            const shipping = Cart.getShipping();
            const total = subtotal + tax + shipping;
            const freeShipping = subtotal >= APP_CONFIG.freeShippingThreshold;

            container.innerHTML = `
                <div class="cart-layout">
                    <div class="cart-items">
                        <h2 style="margin-bottom: var(--space-lg);">Productos (${cartItems.length})</h2>
                        ${cartItems.map(item => `
                            <div class="cart-item">
                                <div class="cart-item-image">
                                    <img src="${item.product.image}" alt="${item.product.name}">
                                </div>
                                <div class="cart-item-info">
                                    <h3>${item.product.name}</h3>
                                    <p class="category">${CATEGORIES.find(c => c.id === item.product.category)?.name || ''}</p>
                                    <p class="price">RD$${item.product.price.toLocaleString()}</p>
                                </div>
                                <div class="cart-item-actions">
                                    <div class="quantity-control">
                                        <button class="quantity-btn" onclick="updateQty(${item.productId}, ${item.quantity - 1})">−</button>
                                        <span class="quantity-value">${item.quantity}</span>
                                        <button class="quantity-btn" onclick="updateQty(${item.productId}, ${item.quantity + 1})">+</button>
                                    </div>
                                    <button class="remove-btn" onclick="Cart.removeItem(${item.productId})">Eliminar</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="cart-summary">
                        <h3 class="summary-title">Resumen del Pedido</h3>
                        ${freeShipping ? '<div class="free-shipping-badge">🎉 ¡Envío gratis aplicado!</div>' : ''}
                        <div class="summary-row"><span>Subtotal</span><span>RD$${subtotal.toLocaleString('es-DO', {minimumFractionDigits: 2})}</span></div>
                        <div class="summary-row"><span>ITBIS (18%)</span><span>RD$${tax.toLocaleString('es-DO', {minimumFractionDigits: 2})}</span></div>
                        <div class="summary-row"><span>Envío</span><span>${freeShipping ? 'Gratis' : 'RD$' + shipping.toLocaleString()}</span></div>
                        <div class="summary-row total"><span>Total</span><span>RD$${total.toLocaleString('es-DO', {minimumFractionDigits: 2})}</span></div>
                        <a href="checkout.html" class="btn btn-primary checkout-btn">Proceder al Pago</a>
                        <a href="catalogo.html" class="continue-shopping">← Seguir comprando</a>
                    </div>
                </div>
            `;
        }

        function updateQty(productId, newQty) {
            if (newQty < 1) {
                Cart.removeItem(productId);
            } else {
                Cart.updateQuantity(productId, newQty);
            }
            renderCartPage();
        }

        document.addEventListener('DOMContentLoaded', renderCartPage);
    </script>
</body>
</html>
