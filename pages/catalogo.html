<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de productos artesanales dominicanos - CaribeSupply">
    <title>Catálogo | CaribeSupply S.A.S.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .catalog-page { padding: var(--space-2xl) 0 var(--space-4xl); }
        .catalog-layout { display: grid; grid-template-columns: 260px 1fr; gap: var(--space-2xl); }
        @media (max-width: 900px) { .catalog-layout { grid-template-columns: 1fr; } }
        .catalog-sidebar { position: sticky; top: 90px; height: fit-content; }
        .filter-section { background: var(--bg-primary); border-radius: var(--radius-xl); padding: var(--space-xl); margin-bottom: var(--space-lg); box-shadow: var(--shadow-sm); }
        .filter-title { font-family: var(--font-display); font-size: var(--text-lg); margin-bottom: var(--space-md); }
        .category-filters { display: flex; flex-direction: column; gap: var(--space-sm); }
        .category-filter { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-sm) var(--space-md); background: var(--bg-secondary); border: 2px solid transparent; border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-fast); }
        .category-filter:hover { background: var(--bg-tertiary); }
        .category-filter.active { background: rgba(26, 95, 60, 0.1); border-color: var(--color-primary); }
        .category-filter input { display: none; }
        .cat-icon { font-size: var(--text-lg); }
        .cat-name { flex: 1; font-size: var(--text-sm); }
        .cat-count { font-size: var(--text-xs); color: var(--text-muted); background: var(--bg-primary); padding: 2px 8px; border-radius: var(--radius-full); }
        .search-box { position: relative; }
        .search-box input { width: 100%; padding: var(--space-md) var(--space-md) var(--space-md) 44px; border: 2px solid var(--bg-tertiary); border-radius: var(--radius-lg); }
        .search-box input:focus { outline: none; border-color: var(--color-primary); }
        .search-box svg { position: absolute; left: var(--space-md); top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .catalog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-xl); flex-wrap: wrap; gap: var(--space-md); }
        .results-count { font-size: var(--text-sm); color: var(--text-secondary); }
        .sort-select { padding: var(--space-sm) var(--space-md); border: 2px solid var(--bg-tertiary); border-radius: var(--radius-md); background: var(--bg-primary); }
        .catalog-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-xl); }
        .no-results { grid-column: 1 / -1; text-align: center; padding: var(--space-4xl); }
        .no-results-icon { font-size: 4rem; margin-bottom: var(--space-lg); }
        .mobile-filter-btn { display: none; width: 100%; margin-bottom: var(--space-lg); }
        @media (max-width: 900px) { 
            .mobile-filter-btn { display: flex; }
            .catalog-sidebar { display: none; }
            .catalog-sidebar.active { display: block; position: fixed; inset: 0; background: var(--bg-primary); z-index: 1000; padding: var(--space-xl); overflow-y: auto; }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    
    <header class="header">
        <nav class="nav">
            <a href="../index.html" class="logo"><span class="logo-icon">🌴</span><span class="logo-text">CaribeSupply</span></a>
            <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu"><span class="hamburger"></span></button>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="../index.html" class="nav-link">Inicio</a></li>
                <li><a href="catalogo.html" class="nav-link active">Catálogo</a></li>
                <li><a href="clima.html" class="nav-link">Clima</a></li>
                <li><a href="tasas.html" class="nav-link">Tasas de Cambio</a></li>
                <li><a href="seguimiento.html" class="nav-link">Seguimiento</a></li>
                <li><a href="soporte.html" class="nav-link">Soporte</a></li>
            </ul>
            <div class="nav-actions">
                <a href="carrito.html" class="cart-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="m1 1 4 4h16l-2 10H7L5 5"/></svg><span class="cart-count" id="cart-count">0</span></a>
                <a href="login.html" class="login-btn" id="auth-btn">Iniciar Sesión</a>
            </div>
        </nav>
    </header>

    <main id="main-content">
        <section class="page-header">
            <div class="container">
                <nav class="breadcrumb"><a href="../index.html">Inicio</a><span>/</span><span>Catálogo</span></nav>
                <h1 class="page-title">Nuestros Productos</h1>
                <p class="page-subtitle">Artesanías auténticas directamente de los artesanos dominicanos</p>
            </div>
        </section>

        <section class="catalog-page">
            <div class="container">
                <button class="btn btn-secondary mobile-filter-btn" onclick="toggleFilters()">☰ Filtros</button>
                <div class="catalog-layout">
                    <aside class="catalog-sidebar" id="filters-sidebar">
                        <div class="filter-section">
                            <div class="search-box">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                                <input type="search" id="search-input" placeholder="Buscar productos...">
                            </div>
                        </div>
                        <div class="filter-section">
                            <h3 class="filter-title">Categorías</h3>
                            <div class="category-filters" id="category-filters"></div>
                        </div>
                    </aside>
                    <div class="catalog-content">
                        <div class="catalog-header">
                            <span class="results-count" id="results-count">0 productos</span>
                            <select class="sort-select" id="sort-select">
                                <option value="featured">Destacados</option>
                                <option value="price-asc">Precio: menor a mayor</option>
                                <option value="price-desc">Precio: mayor a menor</option>
                                <option value="name-asc">Nombre: A-Z</option>
                            </select>
                        </div>
                        <div class="catalog-products" id="products-grid"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer"><div class="container"><div class="footer-bottom"><p class="copyright">© 2024 CaribeSupply S.A.S.</p></div></div></footer>
    <div class="toast-container" id="toast-container"></div>

    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/main.js"></script>
    <script>
        let filters = { category: 'all', search: '', sort: 'featured' };

        document.addEventListener('DOMContentLoaded', () => {
            initFilters();
            const urlCat = new URLSearchParams(window.location.search).get('categoria');
            if (urlCat) filters.category = urlCat;
            renderProducts();
        });

        function initFilters() {
            const container = document.getElementById('category-filters');
            container.innerHTML = `<label class="category-filter active"><input type="radio" name="cat" value="all" checked><span class="cat-icon">🛒</span><span class="cat-name">Todos</span><span class="cat-count">${PRODUCTS.length}</span></label>`;
            CATEGORIES.forEach(c => {
                const count = PRODUCTS.filter(p => p.category === c.id).length;
                container.innerHTML += `<label class="category-filter"><input type="radio" name="cat" value="${c.id}"><span class="cat-icon">${c.icon}</span><span class="cat-name">${c.name}</span><span class="cat-count">${count}</span></label>`;
            });
            container.querySelectorAll('.category-filter').forEach(f => {
                f.onclick = () => {
                    container.querySelectorAll('.category-filter').forEach(x => x.classList.remove('active'));
                    f.classList.add('active');
                    filters.category = f.querySelector('input').value;
                    renderProducts();
                };
            });
            document.getElementById('search-input').oninput = e => { filters.search = e.target.value.toLowerCase(); renderProducts(); };
            document.getElementById('sort-select').onchange = e => { filters.sort = e.target.value; renderProducts(); };
        }

        function renderProducts() {
            let prods = [...PRODUCTS];
            if (filters.category !== 'all') prods = prods.filter(p => p.category === filters.category);
            if (filters.search) prods = prods.filter(p => p.name.toLowerCase().includes(filters.search) || p.description.toLowerCase().includes(filters.search));
            if (filters.sort === 'price-asc') prods.sort((a,b) => a.price - b.price);
            else if (filters.sort === 'price-desc') prods.sort((a,b) => b.price - a.price);
            else if (filters.sort === 'name-asc') prods.sort((a,b) => a.name.localeCompare(b.name));
            else prods.sort((a,b) => (b.featured?1:0) - (a.featured?1:0));

            document.getElementById('results-count').textContent = `${prods.length} producto${prods.length!==1?'s':''}`;
            const grid = document.getElementById('products-grid');
            if (!prods.length) { grid.innerHTML = '<div class="no-results"><div class="no-results-icon">🔍</div><h3>No hay resultados</h3></div>'; return; }
            grid.innerHTML = prods.map(p => `
                <article class="product-card">
                    <div class="product-image"><img src="${p.image}" alt="${p.name}" loading="lazy">${p.badge?`<span class="product-badge">${p.badge}</span>`:''}</div>
                    <div class="product-info">
                        <span class="product-category">${CATEGORIES.find(c=>c.id===p.category)?.name||''}</span>
                        <h3 class="product-name">${p.name}</h3>
                        <p class="product-description">${p.description}</p>
                        <div class="product-footer">
                            <span class="product-price"><span class="currency">RD$</span>${p.price.toLocaleString()}</span>
                            <button class="add-to-cart-btn" onclick="Cart.addItem(${p.id})"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function toggleFilters() {
            document.getElementById('filters-sidebar').classList.toggle('active');
        }
    </script>
</body>
</html>
